name: CI

on:
  push:
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Types
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
      - name: Tests
        run: npm test
      - name: Données
        run: npm run verifier
      - name: Construction
        run: npm run build
      - name: Navigateur des parcours
        run: npx playwright install --with-deps chromium
      - name: Parcours (Playwright)
        run: npm run parcours
